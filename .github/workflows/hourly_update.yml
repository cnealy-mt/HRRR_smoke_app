name: Run UPDATE_HRRR_APP.R

on:
  schedule:
    - cron: "26 * * * *"  # every hour at 26 min
  workflow_dispatch:

jobs:
  update-data:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-renv@v2

      - name: Run update script
        run: Rscript UPDATE_HRRR_APP.R

      - name: Commit updated data as bot (overwrite history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --amend --no-edit -m "Automated data update [skip ci]" || echo "No changes"
          git push --force
